# Production stack for a Raspberry Pi 4, published through a Cloudflare Tunnel.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Nothing here binds a public port. cloudflared dials out to Cloudflare, so the
# Pi needs no port forwarding, no static IP and no inbound firewall hole - and
# gets TLS for free. Ports are exposed to localhost only, for debugging on the
# device itself.
version: "2.4"

x-backend-env: &backend-env
  DJANGO_SETTINGS_MODULE: config.settings.prod
  DATABASE_URL: postgres://ticketing:${POSTGRES_PASSWORD}@db:5432/ticketing
  REDIS_URL: redis://redis:6379/0

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ticketing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ticketing
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketing"]
      interval: 10s
      timeout: 5s
      retries: 10
    # A Pi has little RAM and slow storage; the defaults assume a server.
    command: >
      postgres
      -c max_connections=60
      -c shared_buffers=128MB
      -c effective_cache_size=512MB

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF so a power cut does not silently drop a queue people are sitting in -
    # a real risk on a device with no UPS.
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --workers 2"
    env_file: .env.prod
    environment: *backend-env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # EXACTLY ONE. Fairness comes from a single consumer popping the queue in
  # arrival order. A second replica would still not oversell - the conditional
  # UPDATE holds - but first-come-first-served would no longer be guaranteed.
  allocator:
    build:
      context: ./backend
    restart: unless-stopped
    command: python manage.py run_allocator --event ${EVENT_SLUG:-hack-tues-13}
    env_file: .env.prod
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # PDF rendering, uploads and email. Concurrency 2: WeasyPrint is the heaviest
  # thing on the box and four Pi cores are shared with everything else.
  worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: celery -A config worker -l info --concurrency=2
    env_file: .env.prod
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # EXACTLY ONE, or every periodic task fires twice.
  beat:
    build:
      context: ./backend
    restart: unless-stopped
    command: celery -A config beat -l info
    env_file: .env.prod
    environment: *backend-env
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        # Inlined into the browser bundle at build time, so it must be the
        # public API hostname, not the container name.
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_URL}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - api
      - web

volumes:
  pgdata:
  redisdata:
