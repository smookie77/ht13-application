# Version pinned to 2.4 so the file works with both the compose plugin and the
# older standalone docker-compose binary (which needs it for depends_on.condition).
version: "2.4"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ticketing
      POSTGRES_PASSWORD: ticketing
      POSTGRES_DB: ticketing
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketing"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # AOF so a restart does not silently drop a queue that people are sitting in.
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    command: python manage.py runserver 0.0.0.0:8000
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://ticketing:ticketing@db:5432/ticketing
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # The single consumer that makes ticket handout strictly first-come
  # first-served. Run exactly ONE per event: fairness comes from there being
  # one popper. Scaling this to 2 replicas would still not oversell (the
  # conditional UPDATE holds) but would lose strict ordering.
  allocator:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    command: python manage.py run_allocator --event hack-tues-13
    env_file: .env
    environment: &backend_env
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://ticketing:ticketing@db:5432/ticketing
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Off-request work: expiring abandoned holds now, PDF rendering and email
  # delivery in the next step.
  worker:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    command: celery -A config worker -l info
    env_file: .env
    environment: *backend_env
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Scheduler: fires expire_stale_holds every minute.
  beat:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    command: celery -A config beat -l info
    env_file: .env
    environment: *backend_env
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
